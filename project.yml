name: ChatAI
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: 17.0
targets:
  ChatAI:
    type: application
    platform: iOS
    sources: [ChatAI]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.chatai
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ChatAI
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: 1
        SWIFT_VERSION: 5.0
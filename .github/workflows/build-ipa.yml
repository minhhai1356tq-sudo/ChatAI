name: Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive (no codesign)
        run: |
          xcodebuild archive \
            -project ChatAI.xcodeproj \
            -scheme ChatAI \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/ChatAI.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Create IPA
        run: |
          APP=$(find "$RUNNER_TEMP/ChatAI.xcarchive/Products/Applications" -name "*.app" -type d | head -1)
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP" "$RUNNER_TEMP/Payload/"
          mkdir -p build
          (cd "$RUNNER_TEMP" && zip -rq "$GITHUB_WORKSPACE/build/ChatAI.ipa" Payload)

      - uses: actions/upload-artifact@v4
        with:
          name: ChatAI-ipa
          path: build/ChatAI.ipa
